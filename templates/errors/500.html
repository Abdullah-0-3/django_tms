{% extends 'base.html' %}

{% block title %}Server Error - Task Management System{% endblock %}

{% block content %}
<div class="container-fluid vh-100 d-flex align-items-center justify-content-center">
    <div class="text-center">
        <div class="error-code mb-4">
            <h1 class="display-1 text-danger fw-bold">500</h1>
        </div>
        
        <div class="error-message mb-4">
            <h2 class="h3 text-dark mb-3">Internal Server Error</h2>
            <p class="text-muted lead">
                Something went wrong on our end. We're working to fix it.
            </p>
        </div>
        
        <div class="error-illustration mb-4">
            <i class="fas fa-exclamation-triangle text-warning" style="font-size: 5rem; opacity: 0.7;"></i>
        </div>
        
        <div class="error-actions">
            <a href="/" class="btn btn-primary me-2">
                <i class="fas fa-home me-2"></i>Go Home
            </a>
            <button onclick="location.reload()" class="btn btn-outline-secondary">
                <i class="fas fa-redo me-2"></i>Try Again
            </button>
        </div>
        
        <div class="mt-4">
            <small class="text-muted">
                Error ID: {{ request.META.REQUEST_TIME|default:"Unknown" }}
            </small>
        </div>
    </div>
</div>

<style>
.error-code h1 {
    text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
}
</style>
{% endblock %}
