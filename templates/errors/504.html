{% extends 'base.html' %}

{% block title %}Gateway Timeout - Task Management System{% endblock %}

{% block content %}
<div class="container-fluid vh-100 d-flex align-items-center justify-content-center">
    <div class="text-center">
        <div class="error-code mb-4">
            <h1 class="display-1 text-warning fw-bold">504</h1>
        </div>
        
        <div class="error-message mb-4">
            <h2 class="h3 text-dark mb-3">Gateway Timeout</h2>
            <p class="text-muted lead">
                The server took too long to respond. Please try again.
            </p>
        </div>
        
        <div class="error-illustration mb-4">
            <i class="fas fa-hourglass-half text-warning" style="font-size: 5rem; opacity: 0.7;"></i>
        </div>
        
        <div class="error-actions">
            <button onclick="location.reload()" class="btn btn-primary me-2">
                <i class="fas fa-redo me-2"></i>Try Again
            </button>
            <a href="/" class="btn btn-outline-secondary">
                <i class="fas fa-home me-2"></i>Go Home
            </a>
        </div>
        
        <div class="mt-4">
            <small class="text-muted">
                Request timeout. The server is taking longer than expected to respond.
            </small>
        </div>
    </div>
</div>

<style>
.error-code h1 {
    text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
}
</style>
{% endblock %}
