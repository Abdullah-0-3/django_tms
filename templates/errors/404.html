{% extends 'base.html' %}

{% block title %}Page Not Found - Task Management System{% endblock %}

{% block content %}
<div class="container-fluid vh-100 d-flex align-items-center justify-content-center">
    <div class="text-center">
        <div class="error-code mb-4">
            <h1 class="display-1 text-primary fw-bold">404</h1>
        </div>
        
        <div class="error-message mb-4">
            <h2 class="h3 text-dark mb-3">Page Not Found</h2>
            <p class="text-muted lead">
                The page you're looking for doesn't exist or has been moved.
            </p>
        </div>
        
        <div class="error-illustration mb-4">
            <i class="fas fa-search text-muted" style="font-size: 5rem; opacity: 0.3;"></i>
        </div>
        
        <div class="error-actions">
            <a href="/" class="btn btn-primary me-2">
                <i class="fas fa-home me-2"></i>Go Home
            </a>
            <button onclick="history.back()" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left me-2"></i>Go Back
            </button>
        </div>
        
        <div class="mt-4">
            <small class="text-muted">
                If you believe this is an error, please contact support.
            </small>
        </div>
    </div>
</div>

<style>
.error-code h1 {
    text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
}
</style>
{% endblock %}
