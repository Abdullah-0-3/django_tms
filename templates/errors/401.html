{% extends 'base.html' %}

{% block title %}Unauthorized - Task Management System{% endblock %}

{% block content %}
<div class="container-fluid vh-100 d-flex align-items-center justify-content-center">
    <div class="text-center">
        <div class="error-code mb-4">
            <h1 class="display-1 text-danger fw-bold">401</h1>
        </div>
        
        <div class="error-message mb-4">
            <h2 class="h3 text-dark mb-3">Unauthorized</h2>
            <p class="text-muted lead">
                You need to authenticate to access this resource.
            </p>
        </div>
        
        <div class="error-illustration mb-4">
            <i class="fas fa-user-slash text-danger" style="font-size: 5rem; opacity: 0.7;"></i>
        </div>
        
        <div class="error-actions">
            <a href="/auth/login/" class="btn btn-primary me-2">
                <i class="fas fa-sign-in-alt me-2"></i>Login
            </a>
            <a href="/" class="btn btn-outline-secondary">
                <i class="fas fa-home me-2"></i>Go Home
            </a>
        </div>
        
        <div class="mt-4">
            <small class="text-muted">
                Please login to continue using the application.
            </small>
        </div>
    </div>
</div>

<style>
.error-code h1 {
    text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
}
</style>
{% endblock %}
